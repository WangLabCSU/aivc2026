  n_replace: 2
  rank_key: global_raw
  perturb:
    aux_sigma: 0.1
    main_sigma: 0.15
    seed_offset: 10
  aux_bounds:
  - 0.0
  - 0.6
fitness:
  affine_a: 2.0958
  affine_b: 0.5259
  clip:
  - -0.11
  - 0.1
  min_penalty: 0.15
predict:
  alpha: 0.5
  clip: 4.0
  max_fold: 8.0
  n_cells_per_pert: 400
  xgb_n_jobs: 24
