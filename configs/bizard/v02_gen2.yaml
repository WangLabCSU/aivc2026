scenarios:
  P_H1:
    train_ctx: gwps
    control: non-targeting
  Q_HepG2:
    train_ctx: hepg2
    control: non-targeting
  R_Jurkat:
    train_ctx: jurkat
    control: non-targeting
  S_RPE1:
    train_ctx: rpe1
    control: non-targeting
  S_HCT116:
    train_ctx: hct116
