birds:
- name: b6_g_g2
  scenario: R_Jurkat
  main_weight: 2.412
  seed: 15
  aux_weight: 0.444
  pred_topk: null
  module_off:
  - p53
  - ifn
  inherit_from: b3_r
  replaces: b6_g
- name: b4_s1_g2
  scenario: R_Jurkat
  main_weight: 1.651
  seed: 13
  aux_weight: 0.56
