  map: {CVCL_0023: CVCL_0023, CVCL_0028: CVCL_0028, CVCL_0069: CVCL_0069, CVCL_0099: CVCL_0099, CVCL_0131: CVCL_0131, CVCL_0152: CVCL_0152, CVCL_0179: CVCL_0179, CVCL_0218: CVCL_0218, CVCL_0292: CVCL_0292, CVCL_0293: CVCL_0293, CVCL_0320: CVCL_0320, CVCL_0332: CVCL_0332, CVCL_0334: CVCL_0334, CVCL_0359: CVCL_0359, CVCL_0366: CVCL_0366, CVCL_0371: CVCL_0371, CVCL_0397: CVCL_0397, CVCL_0399: CVCL_0399, CVCL_0428: CVCL_0428, CVCL_0459: CVCL_0459, CVCL_0480: CVCL_0480, CVCL_0504: CVCL_0504, CVCL_0546: CVCL_0546, CVCL_1055: CVCL_1055, CVCL_1056: CVCL_1056, CVCL_1094: CVCL_1094, CVCL_1097: CVCL_1097, CVCL_1098: CVCL_1098, CVCL_1119: CVCL_1119, CVCL_1125: CVCL_1125, CVCL_1239: CVCL_1239, CVCL_1285: CVCL_1285, CVCL_1381: CVCL_1381, CVCL_1478: CVCL_1478, CVCL_1495: CVCL_1495, CVCL_1517: CVCL_1517, CVCL_1531: CVCL_1531, CVCL_1547: CVCL_1547, CVCL_1550: CVCL_1550, CVCL_1571: CVCL_1571, CVCL_1577: CVCL_1577, CVCL_1635: CVCL_1635, CVCL_1666: CVCL_1666, CVCL_1693: CVCL_1693, CVCL_1715: CVCL_1715, CVCL_1716: CVCL_1716, CVCL_1717: CVCL_1717, CVCL_1724: CVCL_1724, CVCL_1731: CVCL_1731, CVCL_C466: CVCL_C466}   # 键=CVCL id, prefix 同 id; basal 与药扰组按 construction 同系
  sig_parquet: data/interim/signatures/tahoe_p12.parquet
  weight: 0.15           # aux 行 sample_weight（v3.5 为 0.3/2 系; v3.6 组数×25 故减半）
