embeddings:
  se600m: data/public/models/SE-600M/protein_embeddings.pt
  tahoe_dir: data/public/models/Tahoe-x1/70m-model
  pca_dim: 128
  use_tahoe: true
xgb:
  objective: reg:pseudohubererror
  max_depth: 9
  n_estimators: 400
  learning_rate: 0.08
  subsample: 0.6
  colsample_bytree: 0.7
  tree_method: hist
  early_stopping_rounds: 40
  label_clip: 4.0
  n_jobs: 40
mlp:
  hidden:
  - 256
  - 128
  dropout: 0.1
  lr: 0.002
  weight_decay: 0.01
  batch_size: 262144
  max_epochs: 12
  patience: 2
  label_clip: 4.0
  huber_beta: 0.5
fusion:
  alpha_grid:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  lambda_grid:
  - 1.5
  - 2.5
bench:
  n_cells_per_pert: 400
  n_ntc_ref: 2000
  n_perts: 100
  lambda_generic: 0.15
  max_abs_delta: 4.0
  max_fold: 8.0
  cell_sampling: true
  seed: 0
paths:
  workdir: data/interim/l15_fusion/v1
  outdir: outputs/metrics/local_bench/l15_fusion_v1h
