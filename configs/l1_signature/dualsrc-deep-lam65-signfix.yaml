# L1.9 fid 专项候选1 官方提交配置：dualsrc-deep λ6.5 + 置信度 v2 符号修正（20261010）
# 与官方最优 20261005_dualsrcdeep_lam65（+0.0886, Rank 633, fid=-0.034）唯一差异：sign_fix
# ——对 w=0.5（gwps×hct116 双源显著反向）1272 基因，聚合前翻非锚定源符号（majority 锚定，
