# E1 双源启发式：gwps(K562) + hct116_all(xatlas p53-WT) 聚合，λ6.5（20261006）
# 与官方提交 configs/l1_signature/dualsrc-deep-lam65.yaml 对齐（max_fold 14——
# 旧版 12 与提交不一致，10/4 缓存 run 的 nmae 退化疑由此起，已重跑 tag=dualdeep_lam65）。
# load_delta 语义：按 (target,gene) 对跨源等权均值；单源独有的对保留单源值（不置零）；
# 未覆盖靶走 gwps generic 兜底。hct116 覆盖 202/300 竞赛靶（Q_HepG2 bench 51/100）。
# 注：签名文件名为 hct116_all.parquet（hct116.parquet 不存在，直接用 _all 名避免静默跳过）。
datasets: [gwps, hct116_all]
lambda_real: 6.5
lambda_generic: 0.15
max_abs_delta: 4.0
max_fold: 14.0
min_mean_cpm: 0.05
cell_sampling: true
seed: 0
controls_dir: data/raw/controls
pert_counts_file: pert_counts.csv
output_stem: 20261005_dualsrcdeep_lam65
