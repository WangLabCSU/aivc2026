# VCC2026 环境 v2（2026-09-28 按调研修正版本约束）
# 修正: python>=3.11 (arc-state 要求 >=3.11,<3.13); 包名 vcc-cli / cell-eval2 / arc-state
# HF 走镜像: export HF_ENDPOINT=https://hf-mirror.com
# 创建: conda env create -f envs/environment.yml && conda activate aivc2026
name: aivc2026
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # --- 官方工具 ---
      - vcc-cli             # 提交 CLI（包名 vcc-cli，命令 vcc）：prep/submit/skill install
      - cell-eval2          # 官方打分器：cell-eval2 --preset vcc2026（0.16.0+）
      - cell-eval           # v1 工具：--ceiling 噪声上限估计仍用得到
      - arc-state           # State 模型（非商业 license，竞赛用途官方鼓励）
      - gpudge              # GPU DE 加速（可选，CUDA>=12.6）
      # --- 数据与科学栈 ---
      - anndata
      - scanpy
      - h5py
      - pandas
      - polars
      - numpy<2.3
      - scipy
      - scikit-learn
      - statsmodels
      - pyarrow
      - tqdm
      - pyyaml
      - hydra-core          # 与 state 生态对齐的配置管理
      - matplotlib
      - seaborn
      - jupyterlab
      # --- 深度学习（按集群 CUDA 版本再固化）---
      - torch
      - lightning
      - einops
# TODO(w1): pip freeze 冻结 -> environment.lock.yml；记录 CUDA/driver 版本
